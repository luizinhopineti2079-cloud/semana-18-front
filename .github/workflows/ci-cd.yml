name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Passo 1: Baixa o código do repositório
    - name: Checkout Code
      uses: actions/checkout@v4

    # Passo 2: Faz o Deploy usando uma Action pronta e segura (não usa comandos npm)
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: . # Copia os arquivos da raiz do projeto
        branch: gh-pages # Envia para a branch de publicação
